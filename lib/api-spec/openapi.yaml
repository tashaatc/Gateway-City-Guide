openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: St. Louis city guide chat
  - name: dishes
    description: Visitor-submitted St. Louis food photos
paths:
  /unsplash/dish-inspiration:
    get:
      operationId: getDishInspiration
      tags: [dishes]
      summary: Search Unsplash for the configured city's favorite dish
      responses:
        "200":
          description: Up to six live Unsplash photos
          content:
            application/json:
              schema:
                type: array
                maxItems: 6
                items:
                  $ref: "#/components/schemas/InspirationPhoto"
        "503":
          description: Unsplash Access Key is missing, invalid, or temporarily rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Unsplash could not be reached or returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /unsplash/dish-inspiration/download:
    post:
      operationId: trackInspirationDownload
      tags: [dishes]
      summary: Register an inspiration photo expansion with Unsplash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspirationDownloadInput"
      responses:
        "204":
          description: Unsplash registered the selection
        "400":
          description: Invalid Unsplash download location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Unsplash is unconfigured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tracking request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Ask the St. Louis city guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: City guide answer and generation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini could not answer the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/system-prompt:
    get:
      operationId: getChatSystemPrompt
      tags: [chat]
      summary: Get the city guide system prompt
      responses:
        "200":
          description: Current system prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPromptResponse"
  /dishes:
    get:
      operationId: listDishPhotos
      tags: [dishes]
      summary: List visitor dish photos
      responses:
        "200":
          description: Dish photos, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhoto"
    post:
      operationId: createDishPhoto
      tags: [dishes]
      summary: Upload a dish photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishPhotoInput"
      responses:
        "201":
          description: The saved dish photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhoto"
        "400":
          description: Invalid title or unsupported image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image exceeds the 3 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The inspector did not approve the photo as toasted ravioli
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error:
                    type: string
                  reason:
                    type: string
        "502":
          description: The inspector is unavailable; nothing was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes/{id}/image:
    get:
      operationId: getDishPhotoImage
      tags: [dishes]
      summary: Get a dish photo image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The stored image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid dish photo ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Dish photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    InspirationDownloadInput:
      type: object
      required: [downloadLocation]
      properties:
        downloadLocation:
          type: string
          format: uri
    InspirationPhoto:
      type: object
      required: [id, imageUrl, rawUrl, altText, photographerName, photographerProfileUrl, downloadLocation]
      properties:
        id:
          type: string
        imageUrl:
          type: string
          format: uri
        rawUrl:
          type: string
          format: uri
        altText:
          type: string
        photographerName:
          type: string
        photographerProfileUrl:
          type: string
          format: uri
        downloadLocation:
          type: string
          format: uri
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChatMessage"
        settings:
          $ref: "#/components/schemas/ChatSettingsInput"
      required: [message]
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000
      required: [role, content]
    ChatSettingsInput:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
    ChatSettings:
      type: object
      properties:
        temperature:
          type: number
        topP:
          type: number
        maxOutputTokens:
          type: integer
      required: [temperature, topP, maxOutputTokens]
    ChatUsage:
      type: object
      properties:
        promptTokens:
          type: ["integer", "null"]
        outputTokens:
          type: ["integer", "null"]
        totalTokens:
          type: ["integer", "null"]
        finishReason:
          type: string
      required: [promptTokens, outputTokens, totalTokens, finishReason]
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          $ref: "#/components/schemas/ChatUsage"
        settings:
          $ref: "#/components/schemas/ChatSettings"
        model:
          type: string
      required: [reply, usage, settings, model]
    SystemPromptResponse:
      type: object
      properties:
        systemPrompt:
          type: string
      required: [systemPrompt]
    DishPhotoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        caption:
          type: string
          maxLength: 500
        image:
          type: string
          description: A JPEG, PNG, or WebP data URL, up to 3 MB decoded.
          maxLength: 4194400
      required: [title, image]
    DishPhoto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        inspectorNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
      required: [id, title, caption, mimeType, inspectorNote, createdAt, imageUrl]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

